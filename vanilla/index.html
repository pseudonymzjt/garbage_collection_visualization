<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVM 垃圾回收解谜挑战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- ===== 左侧控制面板 ===== -->
    <div class="control-panel">
      <h2 class="panel-title">GC Sandbox 控制台</h2>

      <!-- 关卡选择器 -->
      <div class="level-selector">
        <label for="level-select">🎯 关卡选择</label>
        <select id="level-select" onchange="handleLevelChange(this.value)">
          <option value="0">🛝 沙盒模式</option>
          <option value="1">L1: 静态集合膨胀</option>
          <option value="2">L2: 循环引用的孤岛</option>
          <option value="3">L3: 堆内存强引用解耦</option>
          <option value="4">L4: 监听器未注销</option>
          <option value="5">L5: ThreadLocal 遗留</option>
          <option value="6">L6: 未取消的后台 Timer</option>
        </select>
      </div>

      <!-- 关卡信息区 -->
      <div id="level-info-area"></div>

      <!-- 通关徽章 -->
      <div id="level-completed-badge" class="level-completed-badge" style="display: none;">
        🏆 通关成功！内存泄漏已修复！
      </div>

      <!-- 重置/沙盒提示 -->
      <div id="level-action-area"></div>

      <!-- 画布编辑工具 -->
      <div class="btn-group">
        <h3>✏️ 画布编辑</h3>
        <button id="btn-add" onclick="addNode()">+ 新增内存对象</button>
        <button id="btn-link" onclick="toggleLinkMode()">🔗 连线模式</button>
        <button id="btn-delete-edge" onclick="toggleDeleteEdgeMode()">🗑️ 删除连线</button>
        <button onclick="clearCanvas()">🧹 清空画布</button>
      </div>

      <!-- 关卡操作按钮（仅关卡模式下显示） -->
      <div id="level-action-buttons" class="btn-group" style="display: none;">
        <h3>🎮 关卡操作</h3>
        <button id="btn-dismantle" onclick="dismantleComponent()" style="background-color: #ef4444; display: none;">🗑️ 卸下组件</button>
      </div>

      <!-- GC 运行按钮 -->
      <div class="btn-group">
        <h3>⚡ 垃圾回收</h3>
        <button id="btn-ms" onclick="runMarkSweep()" style="background-color: #eab308;">⚡ 标记-清除 (Mark-Sweep)</button>
        <button id="btn-rc" onclick="runReferenceCounting()" style="background-color: #f97316;">🔄 引用计数 (RC)</button>
        <button id="btn-circular" onclick="loadCircularPreset()" style="background-color: #8b5cf6;">🌀 加载：循环引用缺陷场景</button>
      </div>

      <!-- 模式指示器 -->
      <div id="mode-indicator" class="mode-indicator">🖱️ 沙盒模式 — 自由编辑</div>

      <!-- 提示 -->
      <div id="hint-area" class="sandbox-hint">沙盒模式 — 自由编辑画布，运行 GC 算法观察效果</div>
    </div>

    <!-- ===== 中间主画布 ===== -->
    <div class="canvas-container" id="canvas-container"
         onmousemove="handleMouseMove(event)"
         onmouseup="handleMouseUp()"
         onmouseleave="handleMouseLeave()">
      <!-- SVG 连线层 -->
      <svg id="svg-canvas" style="position: absolute; width: 100%; height: 100%; pointer-events: none;">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="60" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
          </marker>
          <marker id="arrow-highlight" viewBox="0 0 10 10" refX="60" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308" />
          </marker>
        </defs>
      </svg>
      <!-- 动态创建的节点会被放到这里 -->
    </div>

    <!-- ===== 右侧 Java 代码对照面板 ===== -->
    <div class="code-panel">
      <h3>
        📜 Java 代码对照
        <span class="code-lang-badge">JVM</span>
      </h3>
      <pre><code id="code-area">
        <!-- 动态渲染的代码行 -->
      </code></pre>
      <!-- 图例说明 -->
      <div class="code-legend">
        <div><span class="legend-dot" style="color: #fbbf24;">🟡</span> 高亮 = 泄漏代码（连线未断）</div>
        <div><span class="legend-dot" style="color: #4b5563; text-decoration: line-through;">⚪</span> 注释 = 已修复（连线已断）</div>
        <div><span class="legend-dot" style="color: #10b981;">🟢</span> 绿色 = GC Root</div>
        <div><span class="legend-dot" style="color: #f97316;">🟠</span> 橙色 = 事件源</div>
        <div><span class="legend-dot" style="color: #8b5cf6;">🟣</span> 紫色 = JVM 内部</div>
        <div><span class="legend-dot" style="color: #475569;">⚫</span> 灰色 = 普通对象</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
